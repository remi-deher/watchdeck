<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="watchdeck-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <radialGradient id="watchdeck-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Fond Squircle Sombre -->
  <rect width="512" height="512" rx="112" fill="#09090b" />

  <!-- Lueur Ambiance Cyan -->
  <circle cx="256" cy="256" r="220" fill="url(#watchdeck-glow)" />

  <!-- Arc de cercle Radar / Scan -->
  <path d="M 390 345 A 176 176 0 1 0 390 167" fill="none" stroke="url(#watchdeck-teal)" stroke-width="16" stroke-linecap="round" />

  <!-- Point lumineux de signal -->
  <circle cx="390" cy="167" r="12" fill="#67e8f9" />

  <!-- Logo 'W' Watchdeck Stylisé -->
  <polyline points="156,146 206,366 256,238 306,366 356,146"
            fill="none" stroke="url(#watchdeck-teal)" stroke-width="40"
            stroke-linecap="round" stroke-linejoin="round" />
</svg>
