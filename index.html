<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- PWA & Mobile Web App Meta -->
    <title>Watchdeck</title>
    <meta name="description" content="Hub de demandes, suivi d'acquisition et amélioration VF pour Plex et *arr." />
    <meta name="application-name" content="Watchdeck" />
    <meta name="theme-color" content="#09090b" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />
    
    <!-- iOS / Safari PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Watchdeck" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    
    <!-- Android / Chrome PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16.png" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
