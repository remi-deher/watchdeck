services:
  api:
    image: ${WATCHDECK_IMAGE:-mrcryllix/watchdeck:latest}
    build: .
    container_name: watchdeck-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    # Docker's default is 10s before SIGKILL — too short if a request (Plex/*arr network
    # call) is mid-flight on shutdown: give the graceful-shutdown path (see app/main.py
    # lifespan) enough room to let it finish and commit cleanly.
    stop_grace_period: 30s
    environment:
      TZ: ${TZ:-Europe/Paris}
      DATABASE_URL: postgresql://watchdeck:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-watchdeck}
      REDIS_URL: redis://redis:6379/0
      ENABLE_ARQ: "1"
      # Optionnelle : si absente, une clé est générée au premier démarrage et persistée
      # dans data/.encryption_key (voir app/crypto.py). La définir explicitement n'est
      # utile que pour fixer la clé à l'avance ou la partager avec une autre instance.
      WATCHDECK_ENCRYPTION_KEY: ${WATCHDECK_ENCRYPTION_KEY:-}
      # Derriere un reverse-proxy (Nginx Proxy Manager, Traefik, Caddy...), IP du proxy :
      # uvicorn lit alors l'IP reelle du client dans X-Forwarded-For. Sans cela, toutes
      # les connexions semblent venir du proxy et l'anti-bruteforce bloque tout le monde
      # au bout de 5 echecs. Ne jamais mettre "*" si le port 8000 est joignable sans proxy.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/favicon.ico')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    image: ${WATCHDECK_IMAGE:-mrcryllix/watchdeck:latest}
    build: .
    container_name: watchdeck-worker
    command: ["arq", "app.jobs.WorkerSettings"]
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      TZ: ${TZ:-Europe/Paris}
      DATABASE_URL: postgresql://watchdeck:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-watchdeck}
      REDIS_URL: redis://redis:6379/0
      ENABLE_ARQ: "1"
      # Optionnelle : si absente, une clé est générée au premier démarrage et persistée
      # dans data/.encryption_key (voir app/crypto.py). La définir explicitement n'est
      # utile que pour fixer la clé à l'avance ou la partager avec une autre instance.
      WATCHDECK_ENCRYPTION_KEY: ${WATCHDECK_ENCRYPTION_KEY:-}
      ARQ_MAX_JOBS: ${ARQ_MAX_JOBS:-15}
      ARQ_JOB_TIMEOUT: ${ARQ_JOB_TIMEOUT:-3600}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "arq", "--check", "app.jobs.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  db:
    image: postgres:15-alpine
    container_name: watchdeck-db
    environment:
      POSTGRES_USER: watchdeck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-watchdeck}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchdeck -d ${POSTGRES_DB:-watchdeck}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: watchdeck-redis
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backup:
    image: postgres:15-alpine
    profiles: ["operations"]
    environment:
      PGHOST: db
      PGUSER: watchdeck
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PGDATABASE: ${POSTGRES_DB:-watchdeck}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./data:/app/data:ro
      - ./scripts/postgres_backup.sh:/usr/local/bin/postgres_backup:ro
    entrypoint: ["sh", "/usr/local/bin/postgres_backup"]
    depends_on:
      db:
        condition: service_healthy

  # Base jetable de la suite pytest (voir tests/async_support.py) : en memoire, rien n'est
  # conserve entre deux demarrages. `docker compose --profile test up -d postgres-test`
  postgres-test:
    image: postgres:15-alpine
    profiles: ["test"]
    container_name: watchdeck-postgres-test
    environment:
      POSTGRES_USER: watchdeck
      POSTGRES_PASSWORD: watchdeck-test
      POSTGRES_DB: watchdeck_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchdeck -d watchdeck_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  restore:
    image: postgres:15-alpine
    profiles: ["operations"]
    environment:
      PGHOST: db
      PGUSER: watchdeck
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PGDATABASE: ${POSTGRES_DB:-watchdeck}
      RESTORE_FILE: ${RESTORE_FILE:-}
      CONFIRM_RESTORE: ${CONFIRM_RESTORE:-}
    volumes:
      - ./backups:/backups:ro
      - ./data:/app/data
      - ./scripts/postgres_restore.sh:/usr/local/bin/postgres_restore:ro
    entrypoint: ["sh", "/usr/local/bin/postgres_restore"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
