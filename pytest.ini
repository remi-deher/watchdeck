[pytest]
asyncio_mode = auto
# Fixe explicitement la portee de boucle des fixtures asynchrones. Sans cette ligne,
# pytest-asyncio emet un avertissement de depreciation a chaque execution et previent
# que la valeur par defaut changera ("fixture" -> "function") dans une version future :
# la definir aujourd'hui evite une bascule silencieuse de comportement a la prochaine
# montee de version. "function" est la valeur vers laquelle le projet ira de toute facon.
asyncio_default_fixture_loop_scope = function
testpaths = tests
addopts = --ignore=app --ignore=alembic
filterwarnings =
    ignore::DeprecationWarning:starlette
    # Connexions SQLite non fermees du pool cree a l'import de app.database. Ce filtre
    # doit etre ici et non dans conftest.py : pytest reinitialise les filtres pour chaque
    # test a partir de cette configuration, si bien qu'un warnings.filterwarnings() pose
    # a l'import de conftest restait sans effet. Visible surtout sous --cov, ou le
    # ramasse-miettes se declenche a d'autres moments (225 avertissements en CI).
    ignore:unclosed database:ResourceWarning
