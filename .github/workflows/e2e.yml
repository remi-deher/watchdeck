name: Responsive E2E

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "app/main.py"
      - "e2e/**"
      - "index.html"
      - "public/**"
      - "package*.json"
      - "playwright.config.js"
      - "vite.config.ts"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "app/main.py"
      - "e2e/**"
      - "index.html"
      - "public/**"
      - "package*.json"
      - "playwright.config.js"
      - "vite.config.ts"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  responsive-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Run Chromium responsive tests
        run: npm run test:e2e -- --project=desktop --project=tablet --project=mobile
      - name: Run iOS WebKit tests
        run: npm run test:e2e -- --project=ios --workers=1
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
