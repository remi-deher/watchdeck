name: Dependabot Auto-Merge

on: pull_request_target

permissions:
  contents: read

jobs:
  dependabot:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Les montees majeures sont desormais auto-mergees comme le reste : la CI
      # (tests, lint, smoke Docker...) est le vrai filet, pas le numero de
      # version. Si une majeure casse dev une fois fusionnee, dev-guard-rollback.yml
      # revert automatiquement et laisse un message explicite sur la PR.
      #
      # Ecosystem "docker" reste exclu : les tags des images de base (ex.
      # python "3.12-alpine" -> "3.14-alpine") n'ont pas 3 composants, donc
      # Dependabot les classe souvent en simple "minor" meme quand il s'agit
      # d'un vrai saut de version majeure du langage/OS -- la CI ne suffit pas
      # a elle seule a couvrir ce cas (mauvaise classification, pas un echec
      # detectable), verifie a la main.
      #
      # PROMOTION_PAT (et non GITHUB_TOKEN) : un merge fait avec le token par
      # defaut d'un workflow ne declenche aucun autre workflow, ce qui empecherait
      # auto-promote-test.yml de prendre le relai une fois la PR mergee dans dev.
      # --delete-branch est sans danger ici : la tete de cette PR est toujours une
      # branche dependabot/* jetable, jamais dev/test/main (contrairement aux PR
      # de promotion, ou la tete EST dev/test/main -- il ne faut surtout pas
      # activer "Automatically delete head branches" au niveau du depot, ça les
      # supprimerait aussi apres chaque promotion).
      - name: Enable auto-merge for Dependabot PRs
        if: steps.metadata.outputs.package-ecosystem != 'docker'
        run: gh pr merge --auto --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.PROMOTION_PAT }}
