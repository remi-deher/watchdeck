name: CodeQL

on:
  push:
    # dev n'a pas de gate CI (push direct autorise, iteration rapide) : ce scan est
    # couteux et n'est requis nulle part avant "test" (voir Protect test) -- inutile
    # de le faire tourner a chaque push dev, le pull_request ci-dessous suffit pour
    # les PR de promotion dev -> test et test -> main.
    branches: [main, test]
  pull_request:
  schedule:
    - cron: "0 7 * * 2"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:${{ matrix.language }}"
