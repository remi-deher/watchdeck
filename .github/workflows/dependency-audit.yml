name: Dependency audit

on:
  push:
    # dev n'a pas de gate CI (push direct autorise) : ce scan tourne sur test/main
    # et via pull_request sur les PR de promotion, pas besoin de le refaire a
    # chaque push dev (voir la meme note dans codeql.yml).
    branches: [main, test]
    paths:
      - "requirements*.txt"
      - "package*.json"
      - ".github/workflows/dependency-audit.yml"
  pull_request:
    paths:
      - "requirements*.txt"
      - "package*.json"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
