name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # CHANGELOG.md est deja a jour pour ce tag : il a ete commite via la PR
      # "chore(release): ..." mergee par auto-version.yml/auto-tag.yml avant la
      # creation de ce tag. Pas besoin de le regenerer ni de pousser sur main
      # (main est protegee, seul un merge de PR peut y ecrire).
      - name: Generate release notes
        id: release_notes
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4
        with:
          config: .github/cliff.toml
          args: --latest --strip header

      - name: Build release body
        id: body
        env:
          NOTES: ${{ steps.release_notes.outputs.content }}
          TAG: ${{ github.ref_name }}
        run: |
          DELIM="RELEASE_BODY_$(date +%s)_$RANDOM"
          {
            echo "body<<$DELIM"
            echo "### 🐳 Images Docker"
            echo ""
            echo "- \`docker.io/mrcryllix/watchdeck:${TAG}\`"
            echo "- \`ghcr.io/remi-deher/watchdeck:${TAG}\`"
            echo ""
            echo "$NOTES"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body: ${{ steps.body.outputs.body }}
          generate_release_notes: false
