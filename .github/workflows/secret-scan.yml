name: Secret Scan

# Pourquoi un scan dedie alors que CodeQL et Trivy tournent deja : ni l'un ni l'autre
# ne detecte une cle d'API ou un jeton committe par megarde. CodeQL analyse des motifs
# de code vulnerable, Trivy des dependances et des couches d'image.
#
# Un secret pousse sur GitHub doit etre traite comme compromis meme s'il est retire au
# commit suivant : il subsiste dans l'historique, dans les forks et dans les caches. Le
# retirer ne suffit pas, il faut le revoquer. D'ou l'interet de l'attraper tot.
#
# L'historique complet est scanne a chaque fois (~70 s sur 141 commits) plutot que le
# seul diff : un secret peut arriver par un merge, un rebase ou une branche rapatriee,
# et une comparaison de diff le manquerait.
on:
  push:
    branches:
      - dev
      - test
      - main
  pull_request:
  # Les regles de detection evoluent : un secret invisible aujourd'hui peut etre
  # reconnu par une version ulterieure, meme sans nouveau commit.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historique complet : sans lui, seul le dernier commit serait analyse.
          fetch-depth: 0

      # L'image officielle est utilisee directement plutot que gitleaks-action, dont
      # l'usage est soumis a licence pour les comptes organisation.
      - name: Scan git history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect \
              --source=/repo \
              --config=/repo/.gitleaks.toml \
              --no-banner \
              --redact \
              --report-format=json \
              --report-path=/repo/gitleaks-report.json

      - name: Explain the failure
        if: failure()
        run: |
          {
            echo "### Secret potentiel detecte"
            echo ""
            echo "Emplacements (valeurs masquees) :"
            echo ""
            python3 -c "
          import json, pathlib
          p = pathlib.Path('gitleaks-report.json')
          if not p.exists():
              print('- rapport indisponible, voir le journal du job')
              raise SystemExit
          for f in json.loads(p.read_text() or '[]'):
              print(f\"- \`{f['File']}:{f['StartLine']}\` — regle \`{f['RuleID']}\` — commit \`{f['Commit'][:8]}\`\")
          "
            echo ""
            echo "**S'il s'agit d'un vrai secret : le revoquer d'abord.** Le retirer de"
            echo "l'historique ne suffit pas, il a deja ete publie."
            echo ""
            echo "S'il s'agit d'un faux positif, l'ajouter a \`.gitleaks.toml\` avec sa justification."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 7
