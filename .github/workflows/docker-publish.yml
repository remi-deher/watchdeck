name: Build & Push Docker image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - test
      - dev
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Empeche de publier une image construite sur un commit dont la CI (tests,
  # lint, smoke Docker, Trivy...) n'est pas encore verte. dev n'a pas de
  # ruleset (push direct autorise pour iterer vite), donc rien d'autre ne
  # garantit cet ordre pour cette branche -- ce job comble le trou en
  # interrogeant les check-runs du commit plutot que d'imposer une liste figee,
  # ce qui s'adapte automatiquement si des checks sont ajoutes/retires plus tard.
  wait-for-ci:
    name: Wait for CI
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Wait for sibling checks to complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Laisse le temps aux autres workflows declenches par le meme push
          # de s'enregistrer avant de commencer a interroger leur statut.
          sleep 45
          DEADLINE=$((SECONDS + 1200))
          while [ $SECONDS -lt $DEADLINE ]; do
            PENDING=$(gh api "repos/$REPO/commits/$SHA/check-runs" --paginate --jq '[.check_runs[] | select(.name != "Wait for CI" and .status != "completed")] | length')
            if [ "$PENDING" = "0" ]; then
              FAILED=$(gh api "repos/$REPO/commits/$SHA/check-runs" --paginate --jq '[.check_runs[] | select(.name != "Wait for CI" and (.conclusion=="failure" or .conclusion=="timed_out"))] | map(.name) | join(", ")')
              if [ -n "$FAILED" ]; then
                echo "::error::Checks en echec, build/push Docker annule : $FAILED"
                exit 1
              fi
              echo "Tous les checks sont verts, build/push autorise."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Timeout en attendant la fin des checks CI."
          exit 1

  build-and-push:
    needs: wait-for-ci
    if: always() && (needs.wait-for-ci.result == 'success' || needs.wait-for-ci.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # signature Cosign keyless (OIDC Fulcio/Rekor)
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute version metadata
        id: version
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
            BRANCH="main"
          else
            BRANCH="${{ github.ref_name }}"
            VERSION="${BRANCH}-${SHORT_SHA}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            mrcryllix/watchdeck
            ghcr.io/remi-deher/watchdeck
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=test,enable=${{ github.ref == 'refs/heads/test' }}
            type=sha,format=short,prefix=dev-,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,format=short,prefix=test-,enable=${{ github.ref == 'refs/heads/test' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
            BRANCH=${{ steps.version.outputs.branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign published images (keyless)
        env:
          # Meme contenu pousse vers les deux registres => meme digest de manifeste,
          # une seule variable suffit pour signer les deux references.
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for image in mrcryllix/watchdeck ghcr.io/remi-deher/watchdeck; do
            cosign sign --yes "${image}@${DIGEST}"
          done
