name: Build & Push Docker image

on:
  workflow_dispatch:
  push:
    # UNE SEULE construction par cycle, sur `test`.
    #
    # - dev  : exclu, personne ne pull une image par commit de travail. dev garde
    #          sa CI (tests/lint), sans build Docker associe.
    # - test : c'est ICI qu'on construit. L'image produite est celle que le staging
    #          fait tourner, puis exactement celle qui partira en production.
    # - main : exclu. Un push sur main (merge de promotion ou commit de release) ne
    #          reconstruit plus rien : le job `promote` ci-dessous reetiquette
    #          l'image deja testee. Auparavant, main et le tag reconstruisaient le
    #          MEME commit en parallele, soit deux images identiques jetees.
    branches:
      - test
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Evite de reconstruire et republier une image identique pour un push qui ne
  # change rien de ce qui entre dedans. Cas concret : sync-main-down.yml refusionne
  # main dans test apres chaque release, et ce merge ne porte que le CHANGELOG --
  # il declenchait pourtant un build+push complet, parfois deux par cycle.
  #
  # ATTENTION : ne PAS remplacer ce job par un simple "paths-ignore: CHANGELOG.md"
  # sur le declencheur. Le commit qu'un tag de release reference ne contient
  # justement QUE CHANGELOG.md (genere par auto-version.yml) : un filtre de chemins
  # s'applique aussi aux pushes de tags et supprimerait donc l'image de release
  # elle-meme. D'ou le court-circuit explicite sur les tags ci-dessous.
  relevant-changes:
    name: Check for relevant changes
    # Inutile sur un tag : celui-ci ne construit rien, il promeut (job `promote`).
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide whether an image is needed
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT_BEFORE: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          # Un tag est l'artefact de release : toujours construit, quel que soit le diff.
          if [ "$REF_TYPE" = "tag" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Premier push sur une branche (pas de "before" exploitable) : on construit.
          if [ -z "$EVENT_BEFORE" ] || [ "$EVENT_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Un historique tronque peut faire echouer le diff : on construit par securite
          # plutot que de rater une image (meme principe que dans e2e.yml).
          if ! CHANGED="$(git diff --name-only "$EVENT_BEFORE...$CURRENT_SHA" 2>&1)"; then
            echo "::warning::git diff a echoue ($CHANGED) -- build par securite."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Fichiers modifies :"
          echo "$CHANGED"
          # Au moins un fichier hors documentation => l'image change vraiment.
          if echo "$CHANGED" | grep -qvE '^(CHANGELOG\.md|docs/.*|.*\.md)$'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Push sans impact sur l'image (documentation seule) : build ignore." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Empeche de publier une image construite sur un commit dont la CI (tests,
  # lint, smoke Docker, Trivy...) n'est pas encore verte. Les autres workflows
  # se declenchent en parallele sur le meme push : le ruleset qui protege test/
  # main ne garantit l'ordre qu'au moment du merge de la PR, pas pour ce
  # workflow qui tourne independamment sur le meme evenement push -- ce job
  # comble le trou en interrogeant les check-runs du commit plutot que
  # d'imposer une liste figee, ce qui s'adapte automatiquement si des checks
  # sont ajoutes/retires plus tard.
  wait-for-ci:
    name: Wait for CI
    needs: relevant-changes
    if: github.event_name != 'workflow_dispatch' && needs.relevant-changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Wait for sibling checks to complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Laisse le temps aux autres workflows declenches par le meme push
          # de s'enregistrer avant de commencer a interroger leur statut.
          sleep 45
          DEADLINE=$((SECONDS + 1200))
          while [ $SECONDS -lt $DEADLINE ]; do
            PENDING=$(gh api "repos/$REPO/commits/$SHA/check-runs" --paginate --jq '[.check_runs[] | select(.name != "Wait for CI" and .status != "completed")] | length')
            if [ "$PENDING" = "0" ]; then
              FAILED=$(gh api "repos/$REPO/commits/$SHA/check-runs" --paginate --jq '[.check_runs[] | select(.name != "Wait for CI" and (.conclusion=="failure" or .conclusion=="timed_out"))] | map(.name) | join(", ")')
              if [ -n "$FAILED" ]; then
                echo "::error::Checks en echec, build/push Docker annule : $FAILED"
                exit 1
              fi
              echo "Tous les checks sont verts, build/push autorise."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Timeout en attendant la fin des checks CI."
          exit 1

  build-and-push:
    needs: [relevant-changes, wait-for-ci]
    # always() reste necessaire pour le cas workflow_dispatch, ou wait-for-ci est
    # volontairement skip. La condition sur relevant-changes, elle, doit etre vraie
    # dans tous les cas : un push sans impact sur l'image ne publie rien.
    # Les tags ne passent PAS par ici : ils sont promus (job `promote`), pas rebatis.
    if: >-
      always() && github.ref_type != 'tag'
      && needs.relevant-changes.outputs.build == 'true'
      && (needs.wait-for-ci.result == 'success' || needs.wait-for-ci.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # signature Cosign keyless (OIDC Fulcio/Rekor)
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute version metadata
        id: version
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
            BRANCH="main"
          else
            BRANCH="${{ github.ref_name }}"
            VERSION="${BRANCH}-${SHORT_SHA}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            mrcryllix/watchdeck
            ghcr.io/remi-deher/watchdeck
          tags: |
            type=raw,value=test,enable=${{ github.ref == 'refs/heads/test' }}
            type=sha,format=short,prefix=test-,enable=${{ github.ref == 'refs/heads/test' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/test' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Indispensable a la promotion : `org.opencontainers.image.revision` grave
          # le commit source dans l'image, et le job `promote` s'en sert pour verifier
          # que l'image testee correspond bien au code qu'on s'apprete a publier.
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
            BRANCH=${{ steps.version.outputs.branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign published images (keyless)
        env:
          # Meme contenu pousse vers les deux registres => meme digest de manifeste,
          # une seule variable suffit pour signer les deux references.
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for image in mrcryllix/watchdeck ghcr.io/remi-deher/watchdeck; do
            cosign sign --yes "${image}@${DIGEST}"
          done

  # PROMOTION (tags uniquement) : publie en production l'image DEJA construite et
  # validee sur le staging, au lieu d'en reconstruire une nouvelle.
  #
  # Une reconstruction, meme depuis un code identique, produit un artefact que
  # personne n'a jamais fait tourner. Ici, les couches applicatives publiees sous
  # `latest`/`vX.Y.Z` sont les blobs exacts de l'image que le staging a exercee.
  promote:
    name: Promote tested image
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # signature Cosign keyless (OIDC Fulcio/Rekor)
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Resolve the tested image
        id: tested
        run: |
          set -euo pipefail
          REF="mrcryllix/watchdeck:test"
          # On passe par un `pull` + `docker inspect` plutot que par
          # `imagetools inspect --format` : nos images sont publiees sous forme de
          # liste de manifestes (multi-plateforme + attestations), et dans ce cas le
          # champ .Image de imagetools devient une map indexee par plateforme --
          # `.Image.Config.Labels` n'y resout pas. `docker inspect` sur l'image tiree
          # a, lui, une forme stable et documentee.
          docker pull --quiet "$REF"
          DIGEST="$(docker inspect --format '{{ index .RepoDigests 0 }}' "$REF" | cut -d@ -f2)"
          REVISION="$(docker inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$REF")"
          if [ -z "$DIGEST" ] || [ -z "$REVISION" ] || [ "$REVISION" = "<no value>" ]; then
            echo "::error::Impossible de determiner l'image testee (digest='$DIGEST', revision='$REVISION')."
            echo "::error::L'image :test doit avoir ete construite APRES l'ajout du label de revision"
            echo "::error::(voir 'labels:' dans le job build-and-push). Promouvoir une image dont on ne"
            echo "::error::peut pas prouver l'origine reviendrait a publier du code non verifie."
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "Image testee : $REF@$DIGEST (commit $REVISION)"

      - name: Verify the tested image matches this release
        env:
          REVISION: ${{ steps.tested.outputs.revision }}
        run: |
          set -euo pipefail
          # Seuls ces chemins entrent dans l'image (voir les COPY du Dockerfile).
          # On les compare volontairement plutot que l'arbre complet : le commit de
          # release ajoute CHANGELOG.md, qui ne fait PAS partie de l'image -- une
          # comparaison d'arbre entier echouerait donc systematiquement a tort.
          PATHS="app alembic alembic.ini scripts docker-entrypoint.sh Dockerfile \
                 frontend package.json package-lock.json vite.config.ts \
                 tsconfig.json tsconfig.node.json index.html requirements.txt"
          if ! git cat-file -e "$REVISION^{commit}" 2>/dev/null; then
            echo "::error::Le commit $REVISION de l'image testee est introuvable dans ce depot."
            exit 1
          fi
          if git diff --quiet "$REVISION" "${{ github.sha }}" -- $PATHS; then
            echo "L'image testee correspond exactement au code de cette release."
          else
            echo "::error::Le code de cette release DIFFERE de l'image testee :"
            git diff --name-only "$REVISION" "${{ github.sha }}" -- $PATHS
            echo "::error::Promotion refusee -- publier cette image livrerait autre chose que le code tague."
            echo "::error::Cause probable : un commit est arrive sur main sans passer par test (hotfix direct)."
            echo "::error::Corriger en resynchronisant main dans test, puis en repromouvant test -> main."
            exit 1
          fi

      - name: Compute release metadata
        id: meta
        run: echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Stamp the release version onto the tested image
        id: stamp
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.release
          push: true
          tags: |
            mrcryllix/watchdeck:${{ github.ref_name }}
            mrcryllix/watchdeck:latest
            ghcr.io/remi-deher/watchdeck:${{ github.ref_name }}
            ghcr.io/remi-deher/watchdeck:latest
          # GIT_SHA porte le commit du TAG, et non celui depuis lequel l'image a ete
          # batie. /api/system/version compare ce champ au commit de la derniere release
          # GitHub pour signaler une instance desalignee : y mettre le commit de `test`
          # affichait ce bandeau d'alerte a CHAQUE release, puisque la promotion reutilise
          # l'image du commit teste alors que le tag pointe sur le commit de release cree
          # juste apres (celui du CHANGELOG).
          #
          # Ce n'est pas un contournement : l'etape de verification ci-dessus a deja
          # prouve que ces deux commits sont identiques sur tout ce qui entre dans
          # l'image. Le commit reellement bati reste trace dans le label OCI ci-dessous.
          #
          # Ne PAS mettre de commentaires a l'interieur des blocs `|` ci-dessous : YAML
          # les traite comme du texte litteral et ils seraient transmis a Docker comme
          # des arguments.
          build-args: |
            BASE_IMAGE=mrcryllix/watchdeck@${{ steps.tested.outputs.digest }}
            APP_VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            BRANCH=main
          # image.revision trace l'artefact d'origine : le commit reellement construit
          # et teste, distinct du commit de release inscrit dans version.json.
          labels: |
            org.opencontainers.image.revision=${{ steps.tested.outputs.revision }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: true
          sbom: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign promoted images (keyless)
        env:
          DIGEST: ${{ steps.stamp.outputs.digest }}
        run: |
          for image in mrcryllix/watchdeck ghcr.io/remi-deher/watchdeck; do
            cosign sign --yes "${image}@${DIGEST}"
          done

      - name: Summary
        run: |
          {
            echo "### Image promue sans reconstruction"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version publiee | \`${{ github.ref_name }}\` + \`latest\` |"
            echo "| Commit source | \`${{ steps.tested.outputs.revision }}\` |"
            echo "| Image testee reutilisee | \`${{ steps.tested.outputs.digest }}\` |"
            echo ""
            echo "Les couches applicatives sont celles exercees sur le staging ;"
            echo "seule la version inscrite dans \`version.json\` a ete estampillee."
          } >> "$GITHUB_STEP_SUMMARY"
