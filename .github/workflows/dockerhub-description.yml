name: Update Docker Hub description

on:
  push:
    branches:
      - main
    paths:
      - DOCKER_HUB.md

# Les identifiants Docker Hub sont des secrets externes, pas GITHUB_TOKEN :
# seule la lecture du depot (pour le checkout) est necessaire.
permissions:
  contents: read

jobs:
  update-description:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update Docker Hub description
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: mrcryllix/watchdeck
          readme-filepath: ./DOCKER_HUB.md
          short-description: "Self-hosted Plex request and availability hub for Sonarr, Radarr, downloads, VO/VF tracking and grouped notifications"
