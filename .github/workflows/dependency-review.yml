name: Dependency Review

# Bloque une PR qui introduit une dependance a vulnerabilite connue (critique/haute)
# ou a licence incompatible, directement dans le diff. Complementaire a pip-audit/
# npm audit/Trivy (dependency-audit.yml, trivy.yml) qui scannent l'arbre complet
# apres coup plutot que le changement propose.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
